{% extends "base.html" %}
{% block title %}Create Shipment{% endblock %}
{% block container_class %}auth-narrow{% endblock %}
{% block content %}
<div class="form-card">
    <div class="form-icon">📦</div>
    <h2>Create a Shipment</h2>
    <p class="form-subtitle">Enter sender and receiver details. We'll generate a Tracking ID once it's booked.</p>

    <form method="POST" action="{{ url_for('shipments.create_shipment') }}">
        <label>Sender Name</label>
        <input type="text" name="sender_name" placeholder="e.g. Priyanka Manuboti"
            value="{{ sender.name if sender else '' }}" required>

        <label>Sender Phone</label>
        <input type="text" name="sender_phone" placeholder="10-digit mobile number"
            value="{{ sender.phone if sender else '' }}" required>

        <label>Pickup Address</label>
        <input type="text" name="sender_address" placeholder="Full pickup address" required>

        <hr style="margin:20px 0; border:none; border-top:1px solid #eee;">

        <label>Receiver Name</label>
        <input type="text" name="receiver_name" placeholder="e.g. Rahul Sharma" required>

        <label>Receiver Phone</label>
        <input type="text" name="receiver_phone" placeholder="10-digit mobile number" required>

        <label>Delivery Address</label>
        <input type="text" name="receiver_address" placeholder="Full delivery address" required>

        <hr style="margin:20px 0; border:none; border-top:1px solid #eee;">

        <label>Package Type</label>
        <input type="text" name="package_type" placeholder="e.g. Documents, Electronics, Clothing">

        <label>Package Description</label>
        <input type="text" name="package_description" placeholder="e.g. 1 laptop, fragile">

        <label>Package Weight (kg)</label>
        <input type="number" step="0.1" name="weight" placeholder="e.g. 2.5">

        <button type="submit">Create Shipment</button>
    </form>

    <p class="form-footer-link"><a href="{{ url_for('shipments.my_shipments') }}">← Back to My Shipments</a></p>
</div>
{% endblock %}
