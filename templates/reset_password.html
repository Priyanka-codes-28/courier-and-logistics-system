{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="form-card">
    <div class="form-icon">🔒</div>
    <h2>Set a New Password</h2>
    <p class="form-subtitle">Choose a new password for your account.</p>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
        <label>New Password</label>
        <div class="password-field">
            <input type="password" name="password" id="password" placeholder="At least 6 characters" required>
            <span class="toggle-password" onclick="togglePassword('password', 'toggleIcon1')" id="toggleIcon1">👁</span>
        </div>

        <label>Confirm New Password</label>
        <div class="password-field">
            <input type="password" name="confirm_password" id="confirm_password" placeholder="Re-enter new password"
                required>
            <span class="toggle-password" onclick="togglePassword('confirm_password', 'toggleIcon2')"
                id="toggleIcon2">👁</span>
        </div>

        <button type="submit">Reset Password</button>
    </form>
</div>

<script>
    function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = '🙈';
        } else {
            input.type = 'password';
            icon.textContent = '👁';
        }
    }
</script>
{% endblock %}
