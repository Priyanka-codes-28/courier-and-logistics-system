{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="form-card">
    <div class="form-icon">📦</div>
    <h2>Create Your Account!</h2>
    <p class="form-subtitle">Sign up to create and track shipments.</p>

    <form method="POST" action="{{ url_for('auth.register') }}">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="e.g. Priyanka Reddy" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required>
        <span class="field-hint">We'll send shipment updates to this email.</span>

        <label>Phone</label>
        <input type="text" name="phone" placeholder="10-digit mobile number">

        <label>Password</label>
        <div class="password-field">
            <input type="password" name="password" id="password" placeholder="At least 6 characters" required>
            <span class="toggle-password" onclick="togglePassword('password', 'toggleIcon1')" id="toggleIcon1">👁</span>
        </div>

        <label>Confirm Password</label>
        <div class="password-field">
            <input type="password" name="confirm_password" id="confirm_password" placeholder="Re-enter your password"
                required>
            <span class="toggle-password" onclick="togglePassword('confirm_password', 'toggleIcon2')"
                id="toggleIcon2">👁</span>
        </div>

        <button type="submit">Create Account</button>
    </form>
    <div class="oauth-divider"><span>OR</span></div>

    <a href="{{ url_for('auth.google_login') }}" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4"
                d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.08-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z" />
            <path fill="#34A853"
                d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33C2.44 15.98 5.48 18 9 18z" />
            <path fill="#FBBC05"
                d="M3.96 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.96H.96A8.996 8.996 0 000 9c0 1.45.35 2.83.96 4.04l3-2.33z" />
            <path fill="#EA4335"
                d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z" />
        </svg>
        Continue with Google
    </a>


    <!-- Login Link -->
    <p class="form-footer-link">
        Already have an account?
        <a href="{{ url_for('auth.login') }}">Login here</a>
    </p>
</div>

<script>
    function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = '🙈';
        } else {
            input.type = 'password';
            icon.textContent = '👁';
        }
    }
</script>
{% endblock %}
