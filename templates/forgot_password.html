{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block container_class %}auth-narrow{% endblock %}
{% block content %}
<div class="form-card">
    <div class="form-icon">🔑</div>
    <h2>Forgot Your Password?</h2>
    <p class="form-subtitle">Enter your email and we'll help you reset it.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required>

        <button type="submit">Send OTP</button>
    </form>

    <p class="form-footer-link"><a href="{{ url_for('auth.login') }}">← Back to Login</a></p>
</div>
{% endblock %}
